# =============================================================================
# teoria-engine configuration
# =============================================================================

# Which model profile to activate
active_model: nemotron

# ---------------------------------------------------------------------------
# Local models directory (optional)
#
# Point to a directory where models are already downloaded to avoid
# re-downloading from HuggingFace. Compatible with LM Studio's model cache.
#
# Default LM Studio paths:
#   Linux : ~/.cache/lm-studio/models
#   macOS : ~/.lmstudio/models
#
# How it works:
#   - vLLM (Linux): the directory is bind-mounted into the container at
#     /models/local. Set local_path (relative to this dir) on each model
#     profile. MUST be HuggingFace SafeTensors format (not GGUF).
#
#   - MLX (macOS): mlx_lm.server receives the resolved host path directly.
#     Supports both HuggingFace format and GGUF files.
#
# Set the path here, then add local_path / local_mlx_path to each model
# profile below. Leave commented to always pull from HuggingFace.
#
# local_models_dir: ~/.cache/lm-studio/models
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Model profiles
#
# Each profile defines:
#   hf_name   — HuggingFace model ID for vLLM (Linux + NVIDIA GPU)
#   mlx_name  — HuggingFace model ID for MLX  (macOS Apple Silicon)
#
# Gateway overrides (optional per-model block):
#   Any key under a model's `gateway:` section overrides the global
#   `gateway:` defaults below. Use this to enforce model-specific
#   operational limits (context size, concurrency, cache behavior).
#
#   gateway:
#     max_input_tokens: <int>
#     max_output_tokens: <int>
#     max_concurrent_requests: <int>
#     cache:
#       enabled: <bool>
#       max_entries: <int>
#       ttl_seconds: <int>
# ---------------------------------------------------------------------------
models:

  nemotron:
    hf_name: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    mlx_name: mlx-community/Mistral-NeMo-Minitron-8B-Instruct-4bit
    # Optional: path relative to local_models_dir (or absolute).
    # vLLM uses local_path (SafeTensors required). MLX uses local_mlx_path (GGUF ok).
    # local_path: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    # local_mlx_path: lmstudio-community/Mistral-Nemo-Instruct-2407-GGUF/Mistral-Nemo-Instruct-2407.Q4_K_M.gguf
    trust_remote_code: true
    max_model_len: 131072
    gpu_memory_utilization: 0.95
    max_num_seqs: 256
    max_num_batched_tokens: 8192
    prefix_caching: true
    chunked_prefill: true
    # Tool calling (required for deepagents / function calling)
    # Supported parsers: llama3_json | mistral | hermes | internlm | granite-20b-fc
    enable_auto_tool_choice: true
    tool_call_parser: llama3_json

  qwen-0.5b:
    hf_name: Qwen/Qwen2.5-0.5B-Instruct
    mlx_name: mlx-community/Qwen2.5-0.5B-Instruct-4bit
    # local_path: Qwen/Qwen2.5-0.5B-Instruct
    # local_mlx_path: lmstudio-community/Qwen2.5-0.5B-Instruct-GGUF/Qwen2.5-0.5B-Instruct-Q8_0.gguf
    max_model_len: 4096
    gpu_memory_utilization: 0.50
    max_num_seqs: 64
    max_num_batched_tokens: 2048
    prefix_caching: true
    chunked_prefill: false
    enable_auto_tool_choice: false

  # ---------------------------------------------------------------------------
  # Qwen3-VL-8B — Vision-Language (24 GB VRAM)
  #
  # vLLM backend: BNB 4-bit (Unsloth). Hard operating envelope from deployment
  # card — do NOT relax these limits without re-validating VRAM headroom.
  #
  # Critical constraints (24 GB VRAM reality):
  #   • 1 image per request; pre-resize to 512–768 px before sending
  #   • max_concurrent_requests must be capped at 2 at the gateway/infra level
  #   • KV cache is the primary failure point with VL — monitor continuously
  #   • --enforce-eager disables CUDA graphs (required for VL stability)
  #   • prefix_caching + chunked_prefill are incompatible with --enforce-eager
  #
  # MLX backend (preferred for vision on Apple Silicon):
  #   mlx-community/Qwen3-VL-8B-Instruct-4bit
  #   max_tokens = 2048 / MAX_PIXELS = 512×512 / 1 image per request / streaming
  # ---------------------------------------------------------------------------
  qwen3-vl-8b:
    hf_name: unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit
    mlx_name: mlx-community/Qwen3-VL-8B-Instruct-4bit
    # local_path: unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit
    # local_mlx_path: lmstudio-community/Qwen3-VL-8B-Instruct-GGUF/Qwen3-VL-8B-Instruct-Q4_K_M.gguf
    trust_remote_code: true
    max_model_len: 4096
    gpu_memory_utilization: 0.82
    max_num_seqs: 2
    max_num_batched_tokens: 4096
    prefix_caching: false
    chunked_prefill: false
    enable_auto_tool_choice: false
    enforce_eager: true
    vllm_extra_args: "--disable-log-stats"
    # Per-model gateway overrides — enforced via load-config merge, not global defaults
    gateway:
      max_input_tokens: 2048   # VL token budget is dominated by image patches, not text
      max_output_tokens: 2048  # deployment card: max_tokens = 2048
      max_concurrent_requests: 2  # hard limit: VL KV cache is unstable above 2
      cache:
        enabled: false         # multimodal requests are unique; caching wastes memory

# ---------------------------------------------------------------------------
# MLX server (macOS only)
# ---------------------------------------------------------------------------
mlx:
  port: 8000
  host: "0.0.0.0"

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
gateway:
  port: 9000
  max_input_tokens: 8000
  max_output_tokens: 2000
  max_concurrent_requests: 64
  cache:
    enabled: true
    max_entries: 2048
    ttl_seconds: 3600

# ---------------------------------------------------------------------------
# NGINX
# ---------------------------------------------------------------------------
nginx:
  rate_limit: "5r/s"
  burst: 20

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
observability:
  otel_endpoint: "http://otel-collector:4317"
  service_name: "teoria-engine"

# ---------------------------------------------------------------------------
# Cloudflare Tunnel
# ---------------------------------------------------------------------------
tunnel:
  id: a550eb52-0f87-4334-aa9e-2bd857968f99
  name: llm-server
  hostname: llm.jambu.ai
